<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <header class="header">
        <div class="header__container">
            <h1 class="header__logo">NextWave</h1>

            <nav class="header__nav">
                <ul class="header__nav-list">
                    <li class="header__nav-item"><a href="#">Features</a></li>
                    <li class="header__nav-item"><a href="#">Pricing</a></li>
                    <li class="header__nav-item"><a href="#">FAQ</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>

        <section class="hero">
            <div class="hero__container">
                <div class="hero__content">
                    <h2 class="hero__content-title">次世代のWeb体験をあなたに</h2>
                    <p class="hero__content-description">
                        圧倒的なパフォーマンスと美しいデザインで、ビジネスを加速させます。
                    </p>
                    <button class="btn btn--primary">今すぐ始める</button>

            </div>
        </section>

        <section class="features">
            <div class="section-container">
                <h2 class="section-title">Features</h2>
                <div class="features__grid">
                    <article class="feature-card">
                        <figure class="feature-card__figure">
                            <span class="feature-card__icon" role="img" aria-label="ロケット">🚀</span>
                            <figcaption>
                                <h3 class="feature-card__title">超高速レスポンス</h3>
                            </figcaption>
                        </figure>
                        <p class="feature-card__description">最新の技術スタックにより、待ち時間のない快適な操作性を実現します。</p>
                    </article>
                    <article class="feature-card">
                        <figure class="feature-card__figure">
                            <span class="feature-card__icon" role="img" aria-label="鍵">🔒</span>
                            <figcaption>
                                <h3 class="feature-card__title">強固なセキュリティ</h3>
                            </figcaption>
                        </figure>
                        <p class="feature-card__description">エンタープライズレベルのセキュリティであなたのデータを守ります。</p>
                    </article>
                    <article class="feature-card">
                        <figure class="feature-card__figure">
                            <span class="feature-card__icon" role="img" aria-label="キラキラ">✨</span>
                            <figcaption>
                                <h3 class="feature-card__title">直感的なデザイン</h3>
                            </figcaption>
                        </figure>
                        <p class="feature-card__description">誰でも迷わず使える、洗練されたユーザーインターフェース。</p>
                    </article>
                </div>
            </div>
        </section>

        <section class="pricing">

        </section>

        <section class="faq">

        </section>

        <section class="cta">

        </section>

    </footer>
